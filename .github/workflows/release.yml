name: Release

# Publicar: git tag v0.2.0 && git push origin v0.2.0
# O .exe sai do runner Windows e os .dmg do runner macOS (um dmg só pode ser montado no macOS).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: dist/*-windows-setup.exe
          - os: macos-latest
            script: dist:mac
            files: dist/*-mac-*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Os testes cobrem a lógica do app e rodam uma vez, no Windows, onde foram validados.
      - if: matrix.os == 'windows-latest'
        run: npm run check
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
          body: |
            ## Instalação

            - **Windows:** baixe `async-videira-*-windows-setup.exe` e execute. O instalador não é assinado: o Windows (SmartScreen) pode avisar. Clique em **Mais informações → Executar assim mesmo**.
            - **macOS:** baixe o `.dmg` do seu Mac (`arm64` para Apple Silicon, `x64` para Intel), arraste o app para Aplicativos. O app não é assinado: na primeira vez, clique com o botão direito no app → **Abrir**. Se o macOS disser que o app está danificado, rode `xattr -cr /Applications/async-videira.app`.
